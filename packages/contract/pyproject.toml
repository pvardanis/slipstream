# The pure-data contract kernel: the config-in/result-out types every workspace member
# depends inward on, under the shared slipstream PEP-420 namespace (ADR-0017).
[project]
name = "slipstream-contract"
version = "0.1.0"
description = "The pure-data contract kernel every slipstream member depends inward on: config, grid, result, and value-object types with their parse."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

# slipstream.contract lives under a shared slipstream namespace: the slipstream/ parent
# carries no __init__.py so other members can share the namespace.
[tool.uv.build-backend]
module-name = "slipstream.contract"

# The orchestration worker member: the Prefect-driven, resumable knob sweep that runs at
# the control point — the parent knob sweep, the per-point Tier-2 sweep, the in-cluster
# GPU redeploy and ceiling scrape, and the S3/SSM transports — depending inward on the
# contract kernel alone. The one member that carries Prefect and boto3, kept off the
# bench-client image so the executor never ships them (ADR-0017).
[project]
name = "slipstream-orchestration"
version = "0.1.0"
description = "The Prefect-driven knob sweep worker: drive a resumable two-tier engine-point sweep from the control point."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "prefect>=3",
    "prefect-aws>=0.7.12",
    "pyyaml>=6",
    "slipstream-contract",
    "typer>=0.12",
]

[project.scripts]
slipstream-orchestrate = "slipstream_bench.orchestration.cli:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

# slipstream_bench.orchestration lives under the shared slipstream_bench namespace: the
# slipstream_bench/ parent carries no __init__.py so it shares the namespace with the
# other members' slipstream_bench.{contract,executor,report} subpackages.
[tool.uv.build-backend]
module-name = "slipstream_bench.orchestration"

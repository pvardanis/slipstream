# The bench executor member: the per-cell vllm bench serve runner, cost post-processors,
# and prefix-cache scraper the bench-client image installs, depending inward on the
# contract kernel alone — no plotting stack, no Prefect (ADR-0017).
[project]
name = "slipstream-bench-executor"
version = "0.1.0"
description = "The L0 bench executor: run one vllm bench serve cell, price it, scrape its prefix-cache hit rate."
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.26.0",
    "pydantic>=2",
    "pyyaml>=6",
    "slipstream-contract",
    "typer>=0.12",
]

[project.scripts]
slipstream-bench = "slipstream_bench.executor.cli:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

# slipstream_bench.executor lives under the shared slipstream_bench namespace: the
# slipstream_bench/ parent carries no __init__.py so it shares the namespace with the
# other members' slipstream_bench.{contract,report,orchestration} subpackages.
[tool.uv.build-backend]
module-name = "slipstream_bench.executor"

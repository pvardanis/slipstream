# No-cloud CI gate (ADR 0002 tier 1): lint/format/validate, Python tests, offline
# terraform tests, and a schema check of the rendered local Helm charts. Runs on PRs
# and pushes to main with no AWS credentials. Jobs gate on the paths a change touches,
# and `ci-ok` is the one required status check (ADR-0027).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the change so the jobs below run only when it can affect them
  # (ADR-0027). docs_only is true when every changed file matches the docs denylist;
  # the image outputs are true when the change touches that image's inputs. Each output
  # reads a filter result the safe way round: a missing result (a manual dispatch,
  # which skips the filter, or a misnamed filter) is never docs-only and always
  # touches the images, so the test jobs run rather than skip. The image builds stay
  # PR-only.
  changes:
    name: classify changed paths
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.filter.outputs.code == 'false' }}
      bench_image: ${{ steps.filter.outputs.bench_image != 'false' }}
      orchestration_image: ${{ steps.filter.outputs.orchestration_image != 'false' }}
    steps:
      # A push is diffed with git against the commit before the push, hence the
      # checkout; a PR's changed files come from the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Excludes must be final, matching the git pathspec's :(exclude): under the
          # default 'some' quantifier a lone '!' pattern ORs in as match-all-but-that-file,
          # so a file under bench/configs/ (or any unrelated file) would still trip the
          # filter. A filter with no '!' pattern matches as under 'some'.
          predicate-quantifier: some-with-excludes
          # code: any changed file outside the docs denylist.
          # bench_image: the bench image inputs, the pathspec in bench/image-tag.sh
          # (image_sha). The detection differs (this gates on the change's diff;
          # image_sha tags from committed history), but the set of paths watched is
          # the same.
          # orchestration_image: the orchestration image inputs, the content-tag
          # pathspec in orchestration-image.yml (Derive image tags).
          # Both image filters exclude markdown, as their pathspecs do, so no change
          # the code filter reads as docs-only can touch an image input.
          # test/ci-paths-parity-test.sh fails when the image lists drift from those
          # pathspecs.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!reports/**'
              - '!.claude/skills/**'
            bench_image:
              - 'bench/**'
              - '!bench/configs/**'
              - 'packages/**'
              - 'pyproject.toml'
              - 'model.yaml'
              - '!**/*.md'
            orchestration_image:
              - 'orchestration/Dockerfile'
              - 'packages/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.dockerignore'
              - 'model.yaml'
              - 'bench/configs/sweep-grid.yaml'
              - 'bench/configs/kv-cache-extension-ab.yaml'
              - 'k8s/vllm-gpu.yaml'
              - '!**/*.md'

  lint:
    name: lint & format (prek)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # The Python uv runs on, the workspace's lowest supported.
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Versions and checksums from mise.toml and mise.lock.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: terraform tflint prek uv yq
      - name: Install tflint plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config="${GITHUB_WORKSPACE}/.tflint.hcl"
      - name: Run prek
        run: prek run --all-files --show-diff-on-failure --color=always
      # The gating check runs here, not with the shell unit tests: those skip on a
      # docs-only change, which is the change a broken gate would misread. It reads the
      # workflows and bench/image-tag.sh with yq and awk (ADR-0027).
      - name: Check the CI path gating
        run: bash test/ci-paths-parity-test.sh

  python:
    name: python tests (pytest)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # The Python uv runs on, the workspace's lowest supported.
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Versions and checksums from mise.toml and mise.lock.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: uv
      - name: Run pytest
        # The default dev group installs every workspace member (contract, executor,
        # report, orchestration), so the suite covers the orchestration layer's
        # Prefect-backed builders without a separate extra (ADR-0017).
        run: uv run pytest

  terraform:
    name: terraform tests (offline)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, bench-endpoint, eks, grafana]
    defaults:
      run:
        working-directory: terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Versions and checksums from mise.toml and mise.lock.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: terraform
      - name: terraform init (no backend)
        run: terraform init -backend=false
      - name: terraform test
        run: |
          shopt -s nullglob
          files=(tests/*.tftest.hcl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no *.tftest.hcl files found — terraform test would pass vacuously" >&2
            exit 1
          fi
          terraform test

  bench-image-build:
    name: bench image build (no push)
    # PR-only: it proves the Dockerfile still builds before merge, with no
    # credentials. A push to main publishes via bench-image.yml, which rebuilds
    # anyway, so repeating the build here on push would be wasted work.
    # Only the bench image's inputs make this build worth running. A PR that
    # leaves them untouched cannot change what the image bakes, so skip the
    # build and let the job pass.
    if: github.event_name == 'pull_request' && needs.changes.outputs.bench_image == 'true'
    # This build is the slowest job in the workflow (timeout-minutes: 30
    # ceiling), so gate it on every other check: a PR that fails any of them
    # cannot merge, and building an image for a doomed PR only burns runner time.
    # Failing one skips the build instead.
    needs: [changes, lint, python, terraform, shell-tests, chart-render]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Versions and checksums from mise.toml and mise.lock.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: yq
      # Build the image model.yaml describes (hfId + revision via image-tag.sh, yq
      # from mise), so a broken Dockerfile or an unfetchable revision fails the PR.
      # No tag, no push: the build succeeding is the check.
      - name: Build the bench image (no push)
        run: bench/build-image.sh

  orchestration-image-build:
    name: orchestration image build (no push)
    # PR-only, same rationale as bench-image-build: prove the Dockerfile still
    # builds before merge with no credentials; a push to main publishes via
    # orchestration-image.yml, which rebuilds anyway.
    # Only the orchestration image's inputs make this build worth running.
    if: github.event_name == 'pull_request' && needs.changes.outputs.orchestration_image == 'true'
    needs: [changes, lint, python, terraform, shell-tests, chart-render]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build succeeding is the check: a broken Dockerfile, an unresolvable
      # locked dependency, or a baked config missing from the context fails
      # the PR. No push.
      - name: Build the orchestration image (no push)
        run: docker build --platform linux/amd64 -f orchestration/Dockerfile -t orchestration-image:pr-build .

      # The worker drives the GPU redeploy and ceiling scrape by shelling out to kubectl
      # (slipstream_bench.orchestration.cluster), so the image must carry it. Assert it
      # resolves on the image PATH here, rather than discovering its absence at run time
      # on the worker, where it fails the sweep at the first point's apply.
      - name: Assert kubectl is on the image PATH
        run: docker run --rm --platform linux/amd64 orchestration-image:pr-build kubectl version --client

  shell-tests:
    name: shell unit tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # image-tag-test.sh asserts the content sha, derived from git history.
          fetch-depth: 0
      # Versions and checksums from mise.toml and mise.lock.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: kubectl promtool yq
      # The image-identity and repo-variable scripts' unit tests (yq from mise;
      # build-image-test stubs docker, gh-vars-test stubs terraform and gh, and
      # orchestration-image-check-test stubs terraform and aws, so no build, GitHub write
      # or AWS call runs). Wiring them here is what makes them more
      # than decorative — a regression in the shared build command fails CI.
      # goodput-parity-test stubs nothing: it reads the real Collector config, bench configs
      # and dashboards with yq and jq and fails when their goodput gates differ (ADR-0026).
      # grafana-cloud-setup-test stubs terraform, aws and the browser openers, so no apply,
      # AWS call or browser runs. bootstrap-test stubs terraform and aws, so no apply or
      # AWS call runs. grafana-mcp-test stubs terraform, aws and uvx, so no terraform read,
      # AWS call or server runs. otel-collector-check-test stubs kubectl, curl and sleep,
      # so no cluster or network call runs; it renders pod fixtures with the real kubectl
      # offline and reads the Collector config with yq.
      # dashboard-allowlist-test stubs nothing: it reads the real dashboards and remote-write
      # allowlist with jq and yq and fails when a panel queries a metric in neither the
      # allowlist's metrics nor its collector_metrics (ADR-0026).
      # dashboard-promql-test stubs nothing: it runs promtool's unit tests against the Fleet
      # health dashboard's real queries, and against mutated copies of them that must fail.
      - name: Run shell unit tests
        run: |
          set -euo pipefail
          bash test/image-tag-test.sh
          bash test/build-image-test.sh
          bash test/gh-vars-test.sh
          bash test/orchestration-image-check-test.sh
          bash test/goodput-parity-test.sh
          bash test/grafana-cloud-setup-test.sh
          bash test/bootstrap-test.sh
          bash test/grafana-mcp-test.sh
          bash test/otel-collector-check-test.sh
          bash test/dashboard-allowlist-test.sh
          bash test/dashboard-promql-test.sh

  chart-render:
    name: helm chart render (kubeconform)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Versions and checksums from mise.toml and mise.lock.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: helm kubeconform
      # Lints and renders every local chart under terraform/*/charts/ and validates the
      # output against the Kubernetes and CRD schemas, so a chart Terraform installs at
      # cluster-up fails here, not at cluster-up, on a template that fails to render or a
      # resource the API server would reject.
      - name: Render and validate the local Helm charts
        run: bash test/chart-render-test.sh

  # The one required status check (ADR-0027). It fails when any job failed or was
  # cancelled and passes when each succeeded or was skipped, so a docs-only change
  # can merge and a new job is covered by adding it to needs, with no change to
  # branch protection. always() makes it run even when a needed job failed or was
  # skipped: either would otherwise skip it, and a skipped required check counts as
  # passing.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - lint
      - python
      - terraform
      - bench-image-build
      - orchestration-image-build
      - shell-tests
      - chart-render
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          if [[ "${FAILED}" == "true" ]]; then
            echo "::error::a required job failed or was cancelled; see the jobs above"
            exit 1
          fi

# No-cloud CI gate (ADR 0002 tier 1): lint/format/validate, Python tests, and
# offline terraform tests. Runs on PRs and pushes to main with no AWS credentials.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint & format (prek)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
      - name: Install tflint plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config="${GITHUB_WORKSPACE}/.tflint.hcl"
      - name: Install prek
        run: uv tool install prek
      - name: Run prek
        run: prek run --all-files --show-diff-on-failure --color=always

  python:
    name: python tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Run pytest
        # The suite covers the orchestration layer's storage builders, which need
        # the Prefect extra the bench-client image omits (ADR-0012 §Amendment).
        run: uv run --extra orchestration pytest

  terraform:
    name: terraform tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, bench-endpoint, eks]
    defaults:
      run:
        working-directory: terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: terraform init (no backend)
        run: terraform init -backend=false
      - name: terraform test
        run: |
          shopt -s nullglob
          files=(tests/*.tftest.hcl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no *.tftest.hcl files found — terraform test would pass vacuously" >&2
            exit 1
          fi
          terraform test

  bench-image-build:
    name: bench image build (no push)
    # PR-only: it proves the Dockerfile still builds before merge, with no
    # credentials. A push to main publishes via bench-image.yml, which rebuilds
    # anyway, so repeating the build here on push would be wasted work.
    if: github.event_name == 'pull_request'
    # This build is the slowest job in the workflow (timeout-minutes: 30
    # ceiling), so gate it on every other check: a PR that fails any of them
    # cannot merge, and building an image for a doomed PR only burns runner time.
    # Failing one skips the build instead.
    needs: [lint, python, terraform, shell-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the bench image's inputs make this build worth running. A PR that
      # leaves them untouched cannot change what the image bakes, so skip the
      # build and let the job pass. The path list mirrors the git pathspec in
      # bench/image-tag.sh (image_sha) — keep the two lists in sync. The
      # detection differs (this gates on the PR's base..head diff; image_sha
      # tags from committed history), but the set of paths watched is the same.
      - name: Detect bench image input changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Excludes must be final, matching the git pathspec's :(exclude): under the
          # default 'some' quantifier a lone '!' pattern ORs in as match-all-but-that-file,
          # so bench/load-sweep.yaml or bench/load-cell.yaml (or any unrelated file) would still
          # trip the build.
          predicate-quantifier: some-with-excludes
          filters: |
            bench:
              - 'bench/**'
              - '!bench/load-sweep.yaml'
              - '!bench/load-cell.yaml'
              - 'src/**'
              - 'pyproject.toml'
              - 'model.yaml'
      # Build the image model.yaml describes (hfId + revision via image-tag.sh, yq
      # preinstalled on the runner), so a broken Dockerfile or an unfetchable
      # revision fails the PR. No tag, no push: the build succeeding is the check.
      - name: Build the bench image (no push)
        if: steps.filter.outputs.bench == 'true'
        run: bench/build-image.sh

  shell-tests:
    name: shell unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # image-tag-test.sh asserts the content sha, derived from git history.
          fetch-depth: 0
      # The image-identity scripts' unit tests (yq preinstalled; build-image-test
      # stubs docker, so no build runs). Wiring them here is what makes them more
      # than decorative — a regression in the shared build command fails CI.
      - name: Run shell unit tests
        run: |
          set -euo pipefail
          bash test/image-tag-test.sh
          bash test/build-image-test.sh

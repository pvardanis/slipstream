# Swept knob grid for `just knob-sweep` (ADR-0009). The recipe reads this file
# through `slipstream-bench sweep-grid`, which validates it against the SweepGrid
# pydantic model; every value the sweep varies lives here, nothing is hard-coded in
# the recipe.
tier1:
  max_num_seqs: [16, 32, 64, 128, 256]

  # KV cache dtype chart labels; sweep_grid maps each to the token vLLM's
  # --kv-cache-dtype accepts (fp16 -> float16).
  kv_cache_dtype: [fp8, fp16]

  # Prefix-caching arm: its deploy flag, and which prefix shares to sweep under it.
  # Caching off reuses no prefix KV, so it sweeps a single 0 baseline (ADR-0009).
  # The keys are quoted so YAML keeps them as the strings "on"/"off", not booleans.
  prefix_caching:
    "on":
      flag: --enable-prefix-caching
      prefix_share: [10, 50, 90]
    "off":
      flag: --no-enable-prefix-caching
      prefix_share: [0]

tier2:
  max_concurrency: [8, 16, 32, 64, 128, 256]
  burstiness: 1.0

# Fixed client-load knobs every cell runs with. The grid is the single source of a
# point's cells the orchestration driver enumerates (ADR-0012): the recipe / driver
# inject --base-url, --model (model.yaml is the served-model source of truth) and
# --out-dir; everything that defines the workload lives here.
load:
  # Prefix+suffix token budget, split by each prefix-share.
  total_len: 1000
  # Requests per cell; sized so the p95 TTFT gate has real tail samples (~25 above
  # p95) rather than resting on the few worst requests.
  num_prompts: 500
  # Distinct shared prefixes to synthesise.
  num_prefixes: 5
  # Output tokens per request.
  output_len: 128
  # Floor the prefix to a multiple of N tokens; 0 disables alignment.
  align_blocks: 0
  # Requests/sec, or 'inf' for an unthrottled sweep.
  request_rate: 8
  # RNG seed, fixed so runs replay identical prefixes.
  seed: 0
  # Goodput SLO passed to vllm bench serve.
  goodput: ["ttft:1000", "tpot:50"]
  # Local tokenizer for prompt synthesis; omit for the self-hosted arm (vLLM defaults
  # it to --model). Required for the commercial arm, whose provider model is not a
  # loadable HF tokenizer.
  # tokenizer: Qwen/Qwen2.5-0.5B-Instruct

# Cell definition for `slipstream-bench load-cell` (one tier-2 client load cell).
# The recipe / bench-sweep.sh inject --base-url, --model (model.yaml is the served-
# model source of truth) and --out-dir; everything that defines the cell — its grid
# coordinate, token budget, SLO, seed — lives here, validated by CellConfig before the
# cell touches the endpoint. The orchestrator renders one of these per grid point from
# a SweepConfig (SweepConfig.cells()) and ships it as this --config.

# Prefix-share %: splits the token budget into shared prefix and suffix.
prefix_share: 50

# Burstiness: low = bursty, 1.0 = Poisson arrivals.
burstiness: 1.0

# Closed-loop in-flight cap; omit to run the cell open-loop, bound only by request_rate.
# max_concurrency: 64

# Prefix+suffix token budget, split by the prefix-share.
total_len: 1000
# Requests for this cell; sized so the p95 TTFT gate has real tail samples (~25 above
# p95) rather than resting on the few worst requests.
num_prompts: 500
# Distinct shared prefixes to synthesise.
num_prefixes: 5
# Output tokens per request.
output_len: 128
# Floor the prefix to a multiple of N tokens; 0 disables alignment.
align_blocks: 0
# Requests/sec, or 'inf' for an unthrottled cell.
request_rate: 8
# RNG seed, fixed so runs replay identical prefixes.
seed: 0
# Goodput SLO passed to vllm bench serve.
goodput: ["ttft:1000", "tpot:50"]

# Local tokenizer for prompt synthesis; omit for the self-hosted arm (vLLM defaults
# it to --model). Required for the commercial arm, whose provider model is not a
# loadable HF tokenizer.
# tokenizer: Qwen/Qwen2.5-0.5B-Instruct

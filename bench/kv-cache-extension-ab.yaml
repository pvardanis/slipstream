# The kv-cache-extension-ab workload (#326): what both arms of the KV cache offload A/B
# run. Each run redeploys the GPU with the arm's offload switch, runs one unrecorded
# warmup cell at warmup_concurrency, then the max_concurrency ladder. The working set —
# num_prefixes distinct prefixes of prefix_share of total_len, floored to whole 16-token
# KV blocks — must fit the CPU tier, or the A/B is refused before its first redeploy, and
# must exceed the GPU KV pool, or it is refused once the engine reports the pool, before
# any cell; the tier size and max-model-len are read off k8s/vllm-gpu.yaml.
engine:
  max_num_seqs: 64
  kv_cache_dtype: fp8

runs_per_arm: 3
# 3584 prompt tokens at 90% floor to a 3216-token prefix: 64 prefixes make a
# 205,824-token working set, past the g5.xlarge's 185,696-token GPU pool, which needs a CPU
# tier of at least 14.13 GiB (205,824 x 73,728 bytes) in LMCACHE_MAX_LOCAL_CPU_SIZE. The
# manifest's 4.0 GiB tier holds 58,254 tokens, so it refuses this workload.
prefix_share: 90
max_concurrency: [8, 16, 32, 64]
warmup_concurrency: 4

# Fixed client-load knobs, the knob sweep's LoadKnobs. total_len plus output_len must fit
# the manifest's max-model-len.
load:
  total_len: 3584
  num_prompts: 512
  num_prefixes: 64
  output_len: 128
  align_blocks: 16
  request_rate: .inf
  seed: 0
  goodput: ["ttft:1000", "tpot:50"]

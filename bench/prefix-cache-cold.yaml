# Scenario definition for a cold-cache `slipstream-bench prefix-cache` run. The
# recipe / bench-prefix-cache.sh curl the /metrics snapshots and vLLM emits the
# cell result JSON; those exist only after the run and stay CLI path arguments.
# Everything knowable before the run — which cache regime this measures — lives
# here, validated by PrefixCacheScenario before the hit-rate join (ADR-0011).

# Cache regime this run measures: cold resets the prefix cache first, warm reuses
# the warmed cache. The label is joined onto the record so the two regimes are
# told apart (ADR-0003).
cache_state: cold

# Served-model selector: the model_name label the prefix-cache series are counted
# under. Omit to default to the result's own model_id; set it only when the metrics
# series is served under a different name than the client's model_id.
# model: Qwen/Qwen2.5-0.5B-Instruct

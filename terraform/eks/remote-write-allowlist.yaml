# The series Prometheus remote-writes to Grafana Cloud (ADR-0026): those the panels read
# and the Collector's exporter counts. Everything else stays in the cluster and dies with
# it, which keeps the free tier under its 10k active series. A panel whose series is not
# listed here gets no data; test/dashboard-allowlist-test.sh fails a dashboard querying one.
# monitoring.tf builds the remote_write keep rule from this file.
metrics:
  # vLLM v0.29.0 (vllm/v1/metrics/loggers.py): KV-cache usage, queueing, TTFT p95 and
  # throughput. Counters are exposed with a _total suffix, histograms as _bucket.
  - vllm:kv_cache_usage_perc
  - vllm:num_requests_waiting
  - vllm:time_to_first_token_seconds_bucket
  - vllm:prompt_tokens_total
  - vllm:generation_tokens_total
  - vllm:request_success_total
  # Karpenter 1.8: node count, create/terminate annotations, pod-provisioning cold start (a
  # summary, so its quantiles are series of the base name), voluntary disruptions, and the
  # scoreboard's price with the allocatable GPUs that tell which node it applies to.
  - karpenter_cluster_state_node_count
  - karpenter_nodes_created_total
  - karpenter_nodes_terminated_total
  - karpenter_pods_startup_duration_seconds
  - karpenter_voluntary_disruption_decisions_total
  - karpenter_nodes_allocatable
  - karpenter_cloudprovider_instance_type_offering_price_estimate
  # dcgm-exporter (dcgm_exporter.tf), per GPU with the pod using it: busy time, and
  # memory-bandwidth active, the share of cycles decode's weight and KV-cache reads keep
  # the memory interface busy.
  - DCGM_FI_DEV_GPU_UTIL
  - DCGM_FI_PROF_DRAM_ACTIVE
  # kube-state-metrics: replicas available against desired.
  - kube_deployment_status_replicas_available
  - kube_deployment_spec_replicas
  # The OTel Collector's own counts, per exporter: spans and metric points sent to Grafana
  # Cloud and those it failed to send.
  - otelcol_exporter_sent_spans
  - otelcol_exporter_send_failed_spans
  - otelcol_exporter_sent_metric_points
  - otelcol_exporter_send_failed_metric_points
# The price gauge has one series per instance type, zone and capacity type; only these
# instance types, the GPU NodePool's (k8s/gpu-node-pool.yaml), are sent.
price_instance_types:
  - g5.xlarge

# Writes the token under the key secretKey of a Secret named secretName, owned by the
# ExternalSecret so it is deleted with it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ required "secretName is required" .Values.secretName }}'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: '{{ include "grafana-cloud-write-token.storeName" . }}'
  target:
    name: '{{ required "secretName is required" .Values.secretName }}'
    creationPolicy: Owner
  data:
    - secretKey: '{{ required "secretKey is required" .Values.secretKey }}'
      remoteRef:
        key: '{{ required "remoteKey is required" .Values.remoteKey }}'

# Writes the token under the key `token` of a Secret named grafana-cloud-write, owned by
# the ExternalSecret so it is deleted with it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud-write
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: grafana-cloud-write
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: '{{ required "remoteKey is required" .Values.remoteKey }}'

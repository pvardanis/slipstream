# Secrets Manager in the stack's region, read with the controller's own Pod Identity
# credentials: no auth block, so the operator uses its pod's default credential chain.
# Namespaced, so only an ExternalSecret in this namespace can read through it.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: '{{ include "grafana-cloud-write-token.storeName" . }}'
spec:
  provider:
    aws:
      service: SecretsManager
      region: '{{ required "region is required" .Values.region }}'

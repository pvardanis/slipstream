# promtool unit tests for the serving fleet's wake trigger, run by
# test/serving-wake-promql-test.sh. Each promql_expr_test names its ScaledObject trigger
# by name in place of an expr; the script fills in the expr from
# k8s/serving/scaled-object.yaml. KEDA activates the trigger, waking the fleet from zero,
# when the query's value is above the trigger's activationThreshold of 0, and reads an
# empty result as 0. No input carries a vllm: series: at zero replicas the Engine
# publishes none. Expected values are worked by hand from the input series.
tests:
  # Requests reach the proxy: 2 per 15 s scrape on the ingress listener, beside
  # Prometheus's own scrapes counted on the metrics listener.
  # Window (4m, 5m] holds the ingress samples at 4m15..5m, 34..40: 6 over 45 s, with a
  # 15 s gap to the window's start, under 1.1 scrape intervals, so extrapolated to 60 s:
  # 8, and 8 / 60 s = 2/15 per second. promtool compares floats exactly, so the value is
  # 2/15 as the division rounds it. Above 0, so the trigger is active.
  - interval: 15s
    input_series:
      - series: 'envoy_http_downstream_rq_total{namespace="serving",pod="serving-proxy-a",envoy_http_conn_manager_prefix="ingress"}'
        values: '0+2x40'
      - series: 'envoy_http_downstream_rq_total{namespace="serving",pod="serving-proxy-a",envoy_http_conn_manager_prefix="metrics"}'
        values: '0+1x40'
    promql_expr_test:
      - trigger: wake
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 0.1333333333333333

  # No request reaches the proxy, while Prometheus still scrapes its metrics listener and
  # another namespace's Envoy, if one ran, takes requests: the rate is 0, so the trigger
  # stays inactive and the fleet returns to 0 after the cooldown.
  - interval: 15s
    input_series:
      - series: 'envoy_http_downstream_rq_total{namespace="serving",pod="serving-proxy-a",envoy_http_conn_manager_prefix="ingress"}'
        values: '7x40'
      - series: 'envoy_http_downstream_rq_total{namespace="serving",pod="serving-proxy-a",envoy_http_conn_manager_prefix="metrics"}'
        values: '0+1x40'
      - series: 'envoy_http_downstream_rq_total{namespace="other",pod="envoy-b",envoy_http_conn_manager_prefix="ingress"}'
        values: '0+3x40'
    promql_expr_test:
      - trigger: wake
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 0

  # The proxy not yet scraped: no Envoy series at all, so the result is empty, which
  # KEDA reads as 0.
  - interval: 15s
    input_series:
      - series: 'up{namespace="serving",job="serving-proxy"}'
        values: '0x40'
    promql_expr_test:
      - trigger: wake
        eval_time: 5m
        exp_samples: []

# promtool unit tests for the Fleet health dashboard's queries, run by
# test/dashboard-promql-test.sh. Each promql_expr_test names its query by panel id and
# refId, or by annotation name, in place of an expr; the script fills in the expr from
# terraform/grafana/dashboards/fleet-health.json with $__range set to 60m. Expected values
# are worked by hand from the input series, not recomputed the way the query does.
tests:
  # Scoreboard, one GPU node: a g5.12xlarge on-demand node with 4 GPUs for the first 30m
  # at $1.20/h, and 3000 prompt + 1500 generation tokens per 30 s scrape. The node is billed
  # once, not once per GPU. Two Karpenter pods scrape its price, which is counted once. A
  # t3.large system node with 0 GPUs is priced but not counted. The g5.12xlarge spot and
  # eu-central-1b prices match the GPU node on all but one of the price join's labels, and
  # the t3.large price on all but instance_type, so a join that ignores any one label
  # matches two prices and fails.
  #
  # Spend: the [60m:1m] subquery steps at 1m..60m; the GPU series' last sample is at 30m,
  # so it is visible at steps 1m..34m (5m lookback, left-open): 34 steps x $1.20 / 60 =
  # $0.68.
  # Tokens: increase over 60m of 0+3000x120 is 357000 sampled over 3570 s, extrapolated
  # to 3600 s = 360000; generation is 180000; 540000 in all.
  - interval: 30s
    input_series:
      - series: 'karpenter_nodes_allocatable{resource_type="nvidia.com/gpu",instance_type="g5.12xlarge",capacity_type="on-demand",zone="eu-central-1a",node_name="gpu1"}'
        values: '4x60'
      - series: 'karpenter_nodes_allocatable{resource_type="cpu",instance_type="t3.large",capacity_type="on-demand",zone="eu-central-1a",node_name="sys1"}'
        values: '2x120'
      - series: 'karpenter_nodes_allocatable{resource_type="nvidia.com/gpu",instance_type="t3.large",capacity_type="on-demand",zone="eu-central-1a",node_name="sys1"}'
        values: '0x120'
      - series: 'karpenter_cloudprovider_instance_type_offering_price_estimate{instance_type="g5.12xlarge",capacity_type="on-demand",zone="eu-central-1a",pod="karpenter-a"}'
        values: '1.2x120'
      - series: 'karpenter_cloudprovider_instance_type_offering_price_estimate{instance_type="g5.12xlarge",capacity_type="on-demand",zone="eu-central-1a",pod="karpenter-b"}'
        values: '1.2x120'
      - series: 'karpenter_cloudprovider_instance_type_offering_price_estimate{instance_type="t3.large",capacity_type="on-demand",zone="eu-central-1a"}'
        values: '0.1x120'
      - series: 'karpenter_cloudprovider_instance_type_offering_price_estimate{instance_type="g5.12xlarge",capacity_type="spot",zone="eu-central-1a"}'
        values: '0.5x120'
      - series: 'karpenter_cloudprovider_instance_type_offering_price_estimate{instance_type="g5.12xlarge",capacity_type="on-demand",zone="eu-central-1b"}'
        values: '1.3x120'
      - series: 'vllm:prompt_tokens_total{namespace="slipstream",pod="v1"}'
        values: '0+3000x120'
      - series: 'vllm:generation_tokens_total{namespace="slipstream",pod="v1"}'
        values: '0+1500x120'
    promql_expr_test:
      # $0.68 / 540000 tokens x 1e6.
      - panel: 17
        ref: A
        eval_time: 60m
        exp_samples:
          - labels: '{}'
            value: 1.259259259259259
      # 540000 tokens / 3600 s / $0.68/h ($0.68 spent over the 1h range).
      - panel: 18
        ref: A
        eval_time: 60m
        exp_samples:
          - labels: '{}'
            value: 220.58823529411765

  # Scoreboard, no tokens: the GPU node is up and priced all range, but the token counters
  # are flat, so their increase is 0 and $ per 1M tokens has no sample, not +Inf.
  - interval: 30s
    input_series:
      - series: 'karpenter_nodes_allocatable{resource_type="nvidia.com/gpu",instance_type="g5.xlarge",capacity_type="on-demand",zone="eu-central-1a",node_name="gpu1"}'
        values: '1x120'
      - series: 'karpenter_cloudprovider_instance_type_offering_price_estimate{instance_type="g5.xlarge",capacity_type="on-demand",zone="eu-central-1a"}'
        values: '1.2x120'
      - series: 'vllm:prompt_tokens_total{namespace="slipstream",pod="v1"}'
        values: '500x120'
      - series: 'vllm:generation_tokens_total{namespace="slipstream",pod="v1"}'
        values: '200x120'
    promql_expr_test:
      - panel: 17
        ref: A
        eval_time: 60m
        exp_samples: []

  # Cold start, buckets born in range: the histogram's buckets first appear at 5m, with
  # one pod start in (150, 300] s. No bucket exists 60m before, so only the born-in-range
  # branch counts them. The quantile interpolates inside (150, 300]:
  # p50 = 150 + 150 x 0.5 = 225; p95 = 150 + 150 x 0.95 = 292.5.
  - interval: 30s
    input_series:
      - series: 'karpenter_pods_provisioning_startup_duration_seconds_bucket{le="150"}'
        values: '_x10 0x110'
      - series: 'karpenter_pods_provisioning_startup_duration_seconds_bucket{le="300"}'
        values: '_x10 1x110'
      - series: 'karpenter_pods_provisioning_startup_duration_seconds_bucket{le="+Inf"}'
        values: '_x10 1x110'
    promql_expr_test:
      - panel: 14
        ref: A
        eval_time: 60m
        exp_samples:
          - labels: '{}'
            value: 225
      - panel: 14
        ref: B
        eval_time: 60m
        exp_samples:
          - labels: '{}'
            value: 292.5

  # Cold start, nothing in range: the buckets exist all range but stay flat, so every
  # bucket's increase is 0 and the quantile is NaN; p50 and p95 have no sample, not NaN.
  - interval: 30s
    input_series:
      - series: 'karpenter_pods_provisioning_startup_duration_seconds_bucket{le="150"}'
        values: '0x120'
      - series: 'karpenter_pods_provisioning_startup_duration_seconds_bucket{le="300"}'
        values: '1x120'
      - series: 'karpenter_pods_provisioning_startup_duration_seconds_bucket{le="+Inf"}'
        values: '1x120'
    promql_expr_test:
      - panel: 14
        ref: A
        eval_time: 60m
        exp_samples: []
      - panel: 14
        ref: B
        eval_time: 60m
        exp_samples: []

  # Disruptions: reason="empty" is born at 20m and rises to 2; with no series 60m before,
  # the born-in-range branch counts its last value, 2. reason="drifted" goes 5 -> 8: an
  # increase of 3 sampled over 30 s..3600 s (3570 s), extrapolated to 3600 s =
  # 3 x 3600 / 3570 = 1080/357.
  - interval: 30s
    input_series:
      - series: 'karpenter_voluntary_disruption_decisions_total{reason="empty",decision="delete"}'
        values: '_x40 1x40 2x40'
      - series: 'karpenter_voluntary_disruption_decisions_total{reason="drifted",decision="replace"}'
        values: '5x100 8x20'
    promql_expr_test:
      - panel: 15
        ref: A
        eval_time: 60m
        exp_samples:
          - labels: '{reason="empty"}'
            value: 2
          - labels: '{reason="drifted"}'
            value: 3.0252100840336134

  # Node-created annotation: the counter is born at 10m and steps 1 -> 2 at 40.5m. At 10m
  # no series exists 2m before, so the born branch gives 1. At 11m the window holds three
  # samples, all 1, so increase is 0; with still no series 2m before, the offset guard
  # drops that 0 and the born branch gives 1. At 41m the samples at 39.5m, 40m, 40.5m and
  # 41m read 1, 1, 2, 2: an increase of 1 over 90 s, extrapolated to the 2m window = 4/3.
  # At 15m and 50m the counter is flat, so there is no sample.
  - interval: 30s
    input_series:
      - series: 'karpenter_nodes_created_total{nodepool="gpu"}'
        values: '_x20 1x60 2x40'
    promql_expr_test:
      - annotation: Node created
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1
      - annotation: Node created
        eval_time: 11m
        exp_samples:
          - labels: '{}'
            value: 1
      - annotation: Node created
        eval_time: 15m
        exp_samples: []
      - annotation: Node created
        eval_time: 41m
        exp_samples:
          - labels: '{}'
            value: 1.3333333333333333
      - annotation: Node created
        eval_time: 50m
        exp_samples: []

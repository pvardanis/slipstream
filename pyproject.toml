[project]
name = "slipstream-bench"
version = "0.1.0"
description = "L0 benchmark harness for the slipstream platform: serve sweeps, cost-per-1M, and prefix-cache hit rates."
requires-python = ">=3.11"
dependencies = [
    "pandas>=3",
    "prometheus-client>=0.26.0",
    "pydantic>=2",
    "pyyaml>=6",
    "seaborn>=0.13",
    "slipstream-contract",
    "typer>=0.12",
]

# The orchestration layer (Prefect-driven sweep resume) runs at the control point,
# never in the bench-client image. The image installs `.` (Prefect-free); the
# driver and CI install `.[orchestration]`. See ADR-0012 §Amendment.
[project.optional-dependencies]
orchestration = [
    "boto3>=1.34",
    "prefect>=3",
    "prefect-aws>=0.7.12",
]

[project.scripts]
slipstream-bench = "slipstream_bench.cli:app"
# The orchestration driver runs at the control point with the orchestration extra; the
# script is installed by `.` too, so its entry guards the extra before importing the
# Prefect-pulling CLI (ADR-0012 §Amendment).
slipstream-orchestrate = "slipstream_bench.orchestration.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.7",
    "ty==0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The repo is a uv workspace: this root member (slipstream_bench) plus the carved
# packages/* members resolve against one lockfile, the contract kernel sourced from the
# workspace rather than an index (ADR-0017).
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
slipstream-contract = { workspace = true }

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests", "packages/contract/src"]

[tool.ty.rules]
missing-type-argument = "error"

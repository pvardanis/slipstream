[project]
name = "slipstream-bench"
version = "0.1.0"
description = "L0 benchmark harness for the slipstream platform: serve sweeps, cost-per-1M, and prefix-cache hit rates."
requires-python = ">=3.11"
dependencies = [
    "pandas>=3",
    "prefect>=3",
    "prefect-aws>=0.7.12",
    "prometheus-client>=0.26.0",
    "pydantic>=2",
    "pyyaml>=6",
    "seaborn>=0.13",
    "typer>=0.12",
]

[project.scripts]
slipstream-bench = "slipstream_bench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.7",
    "ty==0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

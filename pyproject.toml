# The uv workspace root: a virtual root (no [project] of its own) over the four carved
# members under packages/* — the contract kernel and the executor, report, and
# orchestration members that depend inward on it (ADR-0017). It owns the shared lockfile,
# the dev tooling, and the suite config; every importable package lives in a member.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.7",
    "ty==0.0.84",
    # The suite exercises every workspace member, so the dev env installs all four
    # editable. The members resolve from the workspace (not an index) via the sources
    # table below; the virtual root has no runtime deps of its own.
    "slipstream-contract",
    "slipstream-bench-executor",
    "slipstream-report",
    "slipstream-orchestration",
]

# The repo is a uv workspace: the packages/* members resolve against one lockfile, every
# intra-workspace dependency sourced from the workspace rather than an index (ADR-0017).
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
slipstream-contract = { workspace = true }
slipstream-bench-executor = { workspace = true }
slipstream-report = { workspace = true }
slipstream-orchestration = { workspace = true }

[tool.ruff]
line-length = 88

# The virtual root owns no package named slipstream_bench, so pin the shared namespace as
# first-party; its members' imports then sort into their own section below the third-party
# block, the convention every member and test already follows (ADR-0017).
[tool.ruff.lint.isort]
known-first-party = ["slipstream_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = [
    "tests",
    "packages/contract/src",
    "packages/executor/src",
    "packages/report/src",
    "packages/orchestration/src",
]

[tool.ty.rules]
missing-type-argument = "error"

# Request-ID spine stub: a minimal OTel Collector that receives OTLP, maps vLLM's
# spans onto the spine's names with per-request goodput (ADR-0026), enforces
# the shape-only privacy stance, batches, and fans out to its sinks (spec §5.1).
# For the stub the only sink is the debug exporter, whose detailed output puts
# the request_id on the collector's stdout (readable via `kubectl logs`); the
# real sinks attach as further exporters on this same pipeline at L3. No
# tail-sampling.
#
# This file is the single source of truth for the collector config: the local
# integration test (test/otel_spine_test.sh) runs the real collector against it,
# and `just obs-up` loads it verbatim into the cluster ConfigMap.
extensions:
  # Liveness/readiness surface for the k8s probes (the local test does not use it).
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Maps vLLM's llm_request span onto the spine's names before the shape-only
  # guard sees it, and sets per-request goodput (ADR-0026). vLLM v0.29.0 names
  # its attributes gen_ai.*, which the redaction allowlist would drop wholesale.
  # Only spans carrying gen_ai.request.id are mapped; spans already in the
  # spine's names pass through, losing only an slo_met they arrive with.
  transform:
    error_mode: ignore
    trace_statements:
      # Only the Collector sets slo_met: a span that is not vLLM's loses any
      # slo_met it arrives with, so no client can report its own goodput.
      # Runs first, while gen_ai.request.id still marks vLLM's spans.
      - context: span
        conditions:
          - span.attributes["gen_ai.request.id"] == nil
        statements:
          - delete_key(span.attributes, "slo_met")
      - context: span
        conditions:
          - span.attributes["gen_ai.request.id"] != nil
        statements:
          # vLLM's request id is "chatcmpl-" plus the client's X-Request-Id;
          # stripped, request_id is exactly the header value a gateway, Sentry
          # or PostHog joins on.
          - set(span.attributes["request_id"], span.attributes["gen_ai.request.id"])
          - replace_pattern(span.attributes["request_id"], "^chatcmpl-", "")
          - set(span.attributes["prompt_tokens"], span.attributes["gen_ai.usage.prompt_tokens"])
          - set(span.attributes["completion_tokens"], span.attributes["gen_ai.usage.completion_tokens"])
          - delete_key(span.attributes, "gen_ai.request.id")
          - delete_key(span.attributes, "gen_ai.usage.prompt_tokens")
          - delete_key(span.attributes, "gen_ai.usage.completion_tokens")
          # vLLM's span omits the model; the Collector is given the served model
          # (model.yaml's hfId as of the last just obs-up) in MODEL_ID.
          - set(span.attributes["model_id"], "${env:MODEL_ID}")
          # Goodput gates, in seconds: the bench configs' goodput
          # ["ttft:1000", "tpot:50"] (ms). test/goodput-parity-test.sh holds the
          # two equal.
          - set(span.cache["ttft_gate_s"], 1.0)
          - set(span.cache["tpot_gate_s"], 0.05)
          # TPOT = (e2e - TTFT) / (completion_tokens - 1). With one completion
          # token or none TPOT is undefined and counts as 0, so TTFT alone
          # decides, the same one-token rule vllm bench serve applies. A span
          # with more than one completion token but a missing latency leaves
          # tpot_s unset, which fails the gate below.
          - set(span.cache["tpot_s"], 0.0) where span.attributes["completion_tokens"] <= 1
          - set(span.cache["tpot_s"], (span.attributes["gen_ai.latency.e2e"] - span.attributes["gen_ai.latency.time_to_first_token"]) / Double(span.attributes["completion_tokens"] - 1)) where span.attributes["completion_tokens"] > 1 and span.attributes["gen_ai.latency.e2e"] != nil and span.attributes["gen_ai.latency.time_to_first_token"] != nil
          # slo_met: TTFT <= 1.0 s and TPOT <= 0.05 s, both gates inclusive.
          - set(span.attributes["slo_met"], false)
          - set(span.attributes["slo_met"], true) where span.attributes["gen_ai.latency.time_to_first_token"] <= span.cache["ttft_gate_s"] and span.cache["tpot_s"] <= span.cache["tpot_gate_s"]
  # Shape-only guard, fail-closed: only these keys survive on a span; every other
  # span attribute (a raw prompt, a completion, anything vLLM or a future gateway
  # attaches as a span attribute) is dropped before it can reach a sink — the
  # shape-only privacy stance (spec §5.1), enforced here rather than by convention.
  # Scope is span attributes: resource attributes and the span name are not
  # filtered, so shape-only discipline upstream still matters.
  redaction:
    allow_all_keys: false
    allowed_keys:
      - request_id
      - model_id
      - prompt_tokens
      - completion_tokens
      - prefix_hash
      - slo_met
    # Count redacted keys but never emit their names or values — a name list can
    # itself leak shape (spec §5.1). Counts are enough to see the guard working.
    summary: info
  # Batch only — no tail-sampling in the spine stub (spec §5.1).
  batch: {}

exporters:
  # The stub's sink: detailed telemetry on the collector's stdout, so the
  # request_id is visible via `kubectl logs`.
  debug:
    verbosity: detailed

service:
  extensions: [health_check]
  pipelines:
    # vLLM emits OTel traces (spec §5.1); the request_id rides as a span attribute
    # and the debug exporter renders it to the collector's stdout.
    traces:
      receivers: [otlp]
      processors: [transform, redaction, batch]
      exporters: [debug]

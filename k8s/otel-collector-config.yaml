# Request-ID spine: an OTel Collector that receives OTLP, maps vLLM's spans onto
# the spine's names with per-request goodput (ADR-0026), enforces the shape-only
# privacy stance, batches, and fans out to its sinks (spec §5.1): the debug
# exporter, whose detailed output puts the request_id on the collector's stdout
# (readable via `kubectl logs`), and Grafana Cloud Traces. The spanmetrics
# connector derives an exemplar-bearing e2e latency histogram and request counts
# from the same spans and remote-writes them to Grafana Cloud's Prometheus, since
# vLLM's own histograms carry no exemplars. No tail-sampling.
#
# This file is the single source of truth for the collector config: the local
# integration test (test/otel_spine_test.sh) runs the real collector against it,
# swapping the Grafana Cloud sinks for the debug exporter and flushing span metrics
# faster (test/otel-spine-sinks.yaml), and `just obs-up` loads it verbatim into
# the cluster ConfigMap. The GRAFANA_CLOUD_* variables come from the eks stack's
# grafana-cloud-endpoints ConfigMap and the grafana-cloud-write Secret.
extensions:
  # Liveness/readiness surface for the k8s probes (the local test does not use it).
  health_check:
    endpoint: 0.0.0.0:13133
  # Grafana Cloud authenticates each store as its own instance ID, with the one
  # write token scoped metrics:write and traces:write.
  basicauth/grafana-cloud-traces:
    client_auth:
      username: ${env:GRAFANA_CLOUD_TRACES_USERNAME}
      password: ${env:GRAFANA_CLOUD_WRITE_TOKEN}
  basicauth/grafana-cloud-metrics:
    client_auth:
      username: ${env:GRAFANA_CLOUD_METRICS_USERNAME}
      password: ${env:GRAFANA_CLOUD_WRITE_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Maps vLLM's llm_request span onto the spine's names before the shape-only
  # guard sees it, and sets per-request goodput (ADR-0026). vLLM v0.29.0 names
  # its attributes gen_ai.*, which the redaction allowlist would drop wholesale.
  # Only spans carrying gen_ai.request.id are mapped; spans already in the
  # spine's names pass through, losing only an slo_met or ttft_ms they arrive
  # with.
  transform:
    error_mode: ignore
    trace_statements:
      # Only the Collector sets slo_met and ttft_ms: a span that is not vLLM's
      # loses any it arrives with, so no client can report its own goodput or
      # TTFT. Runs first, while gen_ai.request.id still marks vLLM's spans.
      - context: span
        conditions:
          - span.attributes["gen_ai.request.id"] == nil
        statements:
          - delete_key(span.attributes, "slo_met")
          - delete_key(span.attributes, "ttft_ms")
      - context: span
        conditions:
          - span.attributes["gen_ai.request.id"] != nil
        statements:
          # vLLM's request id is "chatcmpl-" plus the client's X-Request-Id;
          # stripped, request_id is exactly the header value a gateway, Sentry
          # or PostHog joins on.
          - set(span.attributes["request_id"], span.attributes["gen_ai.request.id"])
          - replace_pattern(span.attributes["request_id"], "^chatcmpl-", "")
          - set(span.attributes["prompt_tokens"], span.attributes["gen_ai.usage.prompt_tokens"])
          - set(span.attributes["completion_tokens"], span.attributes["gen_ai.usage.completion_tokens"])
          - delete_key(span.attributes, "gen_ai.request.id")
          - delete_key(span.attributes, "gen_ai.usage.prompt_tokens")
          - delete_key(span.attributes, "gen_ai.usage.completion_tokens")
          # vLLM's span omits the model; the Collector is given the served model
          # (model.yaml's hfId as of the last just obs-up) in MODEL_ID.
          - set(span.attributes["model_id"], "${env:MODEL_ID}")
          # Goodput gates, in seconds: the bench configs' goodput
          # ["ttft:1000", "tpot:50"] (ms). test/goodput-parity-test.sh holds the
          # two equal.
          - set(span.cache["ttft_gate_s"], 1.0)
          - set(span.cache["tpot_gate_s"], 0.05)
          # TPOT = (e2e - TTFT) / (completion_tokens - 1). With one completion
          # token or none TPOT is undefined and counts as 0, so TTFT alone
          # decides, the same one-token rule vllm bench serve applies. A span
          # with more than one completion token but a missing latency leaves
          # tpot_s unset, which fails the gate below.
          - set(span.cache["tpot_s"], 0.0) where span.attributes["completion_tokens"] <= 1
          - set(span.cache["tpot_s"], (span.attributes["gen_ai.latency.e2e"] - span.attributes["gen_ai.latency.time_to_first_token"]) / Double(span.attributes["completion_tokens"] - 1)) where span.attributes["completion_tokens"] > 1 and span.attributes["gen_ai.latency.e2e"] != nil and span.attributes["gen_ai.latency.time_to_first_token"] != nil
          # slo_met: TTFT <= 1.0 s and TPOT <= 0.05 s, both gates inclusive.
          - set(span.attributes["slo_met"], false)
          - set(span.attributes["slo_met"], true) where span.attributes["gen_ai.latency.time_to_first_token"] <= span.cache["ttft_gate_s"] and span.cache["tpot_s"] <= span.cache["tpot_gate_s"]
          # TTFT under the spine's name, in milliseconds as spec §5.2's
          # first_token event carries it, so a trace search lists the requests
          # over the TTFT gate by request_id. It is a double, so a TraceQL
          # filter on it needs a decimal literal (span.ttft_ms > 1000.0). A
          # span without TTFT gets none, and loses any ttft_ms it arrives with.
          - delete_key(span.attributes, "ttft_ms")
          - set(span.attributes["ttft_ms"], span.attributes["gen_ai.latency.time_to_first_token"] * 1000) where span.attributes["gen_ai.latency.time_to_first_token"] != nil
  # Shape-only guard, fail-closed: only these keys survive on a span or its
  # resource; every other attribute (a raw prompt, a completion, anything vLLM or
  # a future gateway attaches) is dropped before it can reach a sink — the
  # shape-only privacy stance (spec §5.1), enforced here rather than by convention.
  # The span name is not filtered, so shape-only discipline upstream still matters.
  redaction:
    allow_all_keys: false
    allowed_keys:
      - request_id
      - model_id
      - prompt_tokens
      - completion_tokens
      - prefix_hash
      - slo_met
      - ttft_ms
      # Resource attributes: the sending service, and the vLLM replica's pod
      # name, which spanmetrics and a trace search split by.
      - service.name
      - k8s.pod.name
    # Count redacted keys but never emit their names or values — a name list can
    # itself leak shape (spec §5.1). Counts are enough to see the guard working.
    summary: info
  # Batch only — no tail-sampling (spec §5.1).
  batch: {}

connectors:
  # Request counts and an e2e latency histogram from the spans, after the
  # transform and redaction, so they split by slo_met for live goodput
  # (rate(slo_met=true) / rate(all)). For vLLM's llm_request span the duration
  # is e2e latency. k8s.pod.name is the resource attribute naming the vLLM
  # replica (ADR-0026), so every panel can break down by replica. Each histogram
  # data point carries exemplars, the spans' trace IDs, so a latency panel opens
  # the trace and its request_id.
  span_metrics:
    histogram:
      unit: s
      # LLM requests run from well under a second to minutes, past the
      # connector's default buckets (2 ms to 15 s).
      explicit:
        buckets: [250ms, 500ms, 1s, 2s, 4s, 8s, 15s, 30s, 60s, 120s, 300s]
    dimensions:
      - name: slo_met
      - name: k8s.pod.name
    exemplars:
      enabled: true
    # Once a minute: Grafana Cloud's free tier allows one data point per minute
    # per series, and a faster flush counts against its quota as extra.
    metrics_flush_interval: 60s

exporters:
  # Detailed telemetry on the collector's stdout, so the request_id is visible
  # via `kubectl logs`.
  debug:
    verbosity: detailed
  # Grafana Cloud Traces, over OTLP/gRPC to the stack's Tempo.
  otlp_grpc/grafana-cloud:
    endpoint: ${env:GRAFANA_CLOUD_TRACES_ENDPOINT}
    auth:
      authenticator: basicauth/grafana-cloud-traces
  # Grafana Cloud's Prometheus, the same push endpoint the cluster's Prometheus
  # remote-writes to. Exemplars ride on the histogram's series.
  prometheus_remote_write/grafana-cloud:
    endpoint: ${env:GRAFANA_CLOUD_METRICS_URL}
    auth:
      authenticator: basicauth/grafana-cloud-metrics
    # No target_info series: no panel reads it, and it would take an active
    # series from the free tier's quota.
    target_info:
      enabled: false

service:
  # The Collector's own metrics, each exporter's sent and failed counts among them,
  # on :8888 for `just obs-pivot` and the cluster's Prometheus. The default reader
  # listens on localhost only, which neither reaches.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [health_check, basicauth/grafana-cloud-traces, basicauth/grafana-cloud-metrics]
  pipelines:
    # vLLM emits OTel traces (spec §5.1); the request_id rides as a span attribute.
    # The debug exporter renders it to the collector's stdout, Grafana Cloud Traces
    # stores it, and span_metrics derives the metrics pipeline's input from it.
    traces:
      receivers: [otlp]
      processors: [transform, redaction, batch]
      exporters: [debug, otlp_grpc/grafana-cloud, span_metrics]
    metrics:
      receivers: [span_metrics]
      exporters: [prometheus_remote_write/grafana-cloud]

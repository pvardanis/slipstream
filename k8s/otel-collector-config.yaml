# Request-ID spine stub: a minimal OTel Collector that receives OTLP, enforces
# the shape-only privacy stance, batches, and fans out to its sinks (spec §5.1).
# For the stub the only sink is the debug exporter, whose detailed output puts
# the request_id on the collector's stdout (readable via `kubectl logs`); the
# real sinks attach as further exporters on this same pipeline at L3. No
# tail-sampling.
#
# This file is the single source of truth for the collector config: the local
# integration test (test/otel_spine_test.sh) runs the real collector against it,
# and `just obs-up` loads it verbatim into the cluster ConfigMap.
extensions:
  # Liveness/readiness surface for the k8s probes (the local test does not use it).
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Shape-only guard, fail-closed: only these keys survive on a span; every other
  # span attribute (a raw prompt, a completion, anything vLLM or a future gateway
  # attaches as a span attribute) is dropped before it can reach a sink — the
  # shape-only privacy stance (spec §5.1), enforced here rather than by convention.
  # Scope is span attributes: resource attributes and the span name are not
  # filtered, so shape-only discipline upstream still matters.
  redaction:
    allow_all_keys: false
    allowed_keys:
      - request_id
      - model_id
      - prompt_tokens
      - completion_tokens
      - prefix_hash
    # Count redacted keys but never emit their names or values — a name list can
    # itself leak shape (spec §5.1). Counts are enough to see the guard working.
    summary: info
  # Batch only — no tail-sampling in the spine stub (spec §5.1).
  batch: {}

exporters:
  # The stub's sink: detailed telemetry on the collector's stdout, so the
  # request_id is visible via `kubectl logs`.
  debug:
    verbosity: detailed

service:
  extensions: [health_check]
  pipelines:
    # vLLM emits OTel traces (spec §5.1); the request_id rides as a span attribute
    # and the debug exporter renders it to the collector's stdout.
    traces:
      receivers: [otlp]
      processors: [redaction, batch]
      exporters: [debug]

# The request-ID spine: an OTel Collector in the slipstream cluster. It receives
# OTLP (gRPC 4317 / HTTP 4318), enforces the shape-only guard, batches, writes the
# telemetry — request_id and all — to its stdout, readable with `kubectl logs`, and
# exports the traces to Grafana Cloud Traces and their span metrics to Grafana
# Cloud's Prometheus. The collector config is a separate file
# (k8s/otel-collector-config.yaml) loaded into a ConfigMap by `just obs-up`, so the
# same config the local test exercises is what the cluster runs. Reachable
# in-cluster as otel-collector.slipstream.svc:4317; no public endpoint.
#
# The slipstream namespace is created by the eks stack (`just cluster-up`), and
# `just obs-up` and k8s/vllm.yaml apply it too; it is deliberately not declared
# here so `just obs-down` (kubectl delete -f) removes only the collector, never the
# shared namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: slipstream
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      # We reach the collector by DNS, not the per-Service env vars Kubernetes
      # would otherwise inject; keep the container env clean.
      enableServiceLinks: false
      # Pin to the x86_64 node group that exists today; the contrib image tag is
      # x86_64, so this keeps the pod off any arm64 node a later layer adds. (It
      # does not exclude GPU nodes — those are amd64 too; that needs a taint.)
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: otel-collector
          # Contrib distro: the redaction processor that enforces shape-only is
          # not in the core collector. Pinned so a measurement reproduces.
          image: otel/opentelemetry-collector-contrib:0.160.0
          # The served model, stamped as model_id on vLLM spans. Not optional:
          # without it the pod does not start, rather than exporting spans with an
          # empty model_id.
          env:
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: otel-collector-config
                  key: model-id
            # Where Grafana Cloud takes traces and span metrics, and the instance
            # IDs each authenticates as: the eks stack's grafana-cloud-endpoints
            # ConfigMap, from the grafana stack's outputs. Not optional: without
            # them the pod does not start, rather than running with nowhere to
            # export.
            - name: GRAFANA_CLOUD_TRACES_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: grafana-cloud-endpoints
                  key: traces-endpoint
            - name: GRAFANA_CLOUD_TRACES_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: grafana-cloud-endpoints
                  key: traces-username
            - name: GRAFANA_CLOUD_METRICS_URL
              valueFrom:
                configMapKeyRef:
                  name: grafana-cloud-endpoints
                  key: metrics-url
            - name: GRAFANA_CLOUD_METRICS_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: grafana-cloud-endpoints
                  key: metrics-username
            # The metrics:write + traces:write token both exporters authenticate
            # with, which ESO syncs into this namespace once cluster-up installs
            # its ExternalSecret.
            - name: GRAFANA_CLOUD_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-write
                  key: token
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: slipstream
  labels:
    app: otel-collector
spec:
  # ClusterIP only: OTLP stays inside the cluster, nothing public, teardown
  # leaves nothing behind.
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http

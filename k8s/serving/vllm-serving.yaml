# Generated by `just render-serving-manifest` from k8s/vllm-gpu.yaml: do not edit.
# The serving fleet (ADR-0031), at the 0%-share knob-sweep winner:
#   --max-num-seqs 32 --kv-cache-dtype fp8 --no-enable-prefix-caching
# Namespace serving, NodePort 30801, and no replicas: KEDA alone owns the count.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-serving
  namespace: serving
  labels:
    app: vllm-serving
spec:
  strategy:
    type: Recreate
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app: vllm-serving
  template:
    metadata:
      labels:
        app: vllm-serving
    spec:
      enableServiceLinks: false
      nodeSelector:
        nvidia.com/gpu: 'true'
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: 'true'
        effect: NoSchedule
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.29.0
        args:
        - --model
        - Qwen/Qwen3-8B-AWQ
        - --revision
        - 4da05a8edb55c6046cce958586c33b61da07bb79
        - --quantization
        - awq_marlin
        - --kv-cache-dtype
        - fp8
        - --tensor-parallel-size
        - '1'
        - --max-model-len
        - '4096'
        - --gpu-memory-utilization
        - '0.90'
        - --kv-cache-memory-bytes
        - None
        - --max-num-seqs
        - '32'
        - --no-enable-prefix-caching
        - --kv-transfer-config
        - None
        - --otlp-traces-endpoint
        - grpc://otel-collector.slipstream.svc:4317
        env:
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: vllm-api-key
              key: api-key
        - name: LMCACHE_LOCAL_CPU
          value: 'True'
        - name: LMCACHE_MAX_LOCAL_CPU_SIZE
          value: '4.0'
        - name: LMCACHE_CHUNK_SIZE
          value: '256'
        - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
          value: 'true'
        - name: OTEL_SERVICE_NAME
          value: vllm
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.pod.name=$(POD_NAME)
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: '2'
            memory: 8Gi
          limits:
            memory: 8Gi
            nvidia.com/gpu: 1
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
          failureThreshold: 80
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-serving
  namespace: serving
  labels:
    app: vllm-serving
spec:
  type: NodePort
  selector:
    app: vllm-serving
  ports:
  - name: http
    port: 8000
    targetPort: http
    nodePort: 30801

# Cluster values the eks stack's root Application passes in (terraform/eks/argocd.tf,
# helm.valuesObject): the root's own repository and revision, and the cluster-specific
# values only Terraform knows. Empty here: the root Application always supplies them.

# The repository and revision the child apps sync from: the root Application's own.
source:
  repoURL: ""
  targetRevision: ""

# The orchestration image repository URL (the bootstrap stack's ECR repository).
orchestrationImageRepository: ""

# The orchestration image's immutable content-sha tag the Prefect worker runs, resolved
# from the repository's :main image.
orchestrationImageTag: ""

# The Prefect server's in-cluster API URL the worker polls.
prefectApiUrl: ""

# Namespace names the eks stack creates.
namespaces:
  # The Prefect server's namespace, where the worker runs and Pod Identity binds its
  # ServiceAccount.
  prefect: ""

# ServiceAccount names the eks stack binds to IAM through Pod Identity.
serviceAccounts:
  # The Prefect worker's ServiceAccount, in the prefect namespace.
  prefectWorker: ""

# ConfigMap names the eks stack publishes.
configMaps:
  # The bench-endpoint topology the worker loads into its environment (prefect namespace).
  benchEndpointTopology: ""
